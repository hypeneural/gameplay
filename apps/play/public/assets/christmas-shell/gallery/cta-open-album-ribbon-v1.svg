<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 54" fill="none">
  <defs>
    <linearGradient id="ribbonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b62b47"/>
      <stop offset="50%" stop-color="#911d35"/>
      <stop offset="100%" stop-color="#690d21"/>
    </linearGradient>
    <linearGradient id="ribbonGoldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfaf5b"/>
      <stop offset="50%" stop-color="#fff2cc"/>
      <stop offset="100%" stop-color="#dfaf5b"/>
    </linearGradient>
    <linearGradient id="ribbonSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Main Ribbon Rounded Base -->
  <rect x="2" y="2" width="336" height="50" rx="16" fill="url(#ribbonBody)"/>
  <rect x="2" y="2" width="336" height="50" rx="16" fill="url(#ribbonSheen)"/>
  <rect x="2" y="2" width="336" height="50" rx="16" stroke="url(#ribbonGoldBorder)" stroke-width="1.4"/>

  <!-- Inset Gold Stitching Line -->
  <rect x="6" y="6" width="328" height="42" rx="12" stroke="#f6d38e" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Left Star Clasp -->
  <g transform="translate(18, 27)">
    <path d="M0,-5 L1.3,-1.3 L5,0 L1.3,1.3 L0,5 L-1.3,1.3 L-5,0 L-1.3,-1.3 Z" fill="#fff1c8"/>
  </g>

  <!-- Right Star Clasp -->
  <g transform="translate(322, 27)">
    <path d="M0,-5 L1.3,-1.3 L5,0 L1.3,1.3 L0,5 L-1.3,1.3 L-5,0 L-1.3,-1.3 Z" fill="#fff1c8"/>
  </g>
</svg>
