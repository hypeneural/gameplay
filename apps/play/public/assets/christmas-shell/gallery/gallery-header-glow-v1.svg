<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" fill="none">
  <defs>
    <radialGradient id="centerAmbientGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffeac2" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#f5cb74" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#df9e38" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b46d1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sideSoftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd599" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central Warm Radiance -->
  <rect x="0" y="0" width="760" height="140" fill="url(#centerAmbientGlow)"/>

  <!-- Subtle Side Accents -->
  <circle cx="120" cy="45" r="90" fill="url(#sideSoftGlow)"/>
  <circle cx="640" cy="45" r="90" fill="url(#sideSoftGlow)"/>
</svg>
