# Persistence and Tailscale overlay for VPS Contabo Corte 2 publication testing.
# Used on the VPS at /srv/platform/stacks/christmas-games/compose.yaml
services:
  gateway:
    image: nginx:alpine
    container_name: christmas-games-gateway
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/web:/var/www/html/web:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/public/social:/var/www/html/public/social:ro
      - ${MEDIA_DIR:-/srv/runtime/christmas-games/data/media}:/srv/christmas-private/derived:ro
    networks:
      - edge
      - backend
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/healthz']
      interval: 15s
      timeout: 5s
      retries: 3

  catalog:
    image: node:24-alpine
    container_name: christmas-games-catalog
    restart: unless-stopped
    ports:
      # Private upload endpoint exposed strictly on Tailscale VPN interface
      - '100.116.8.109:4180:4180'
    working_dir: /app
    environment:
      NODE_ENV: production
      CATALOG_RELEASE_STAGE: staging-demo
      CATALOG_PUBLIC_ORIGIN: https://jogos.fotosdenatal.com
      CATALOG_SOCIAL_PREVIEW_FILE: /srv/secrets/christmas-games/social-preview.json
      CATALOG_APPLICATION_SHELL: /var/www/html/web/index.html
      CATALOG_DATABASE_PATH: /var/lib/christmas-games/sqlite/catalog.db
      CATALOG_STORAGE_DIR: /var/lib/christmas-games/media
      PUBLISHER_API_SECRET_FILE: /srv/secrets/christmas-games/publisher.secret
      CATALOG_SERVER_SECRET_FILE: /srv/secrets/christmas-games/server.secret
      PORT: 4180
      HOST: 0.0.0.0
    volumes:
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/server:/app/server:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/package.json:/app/package.json:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/web:/var/www/html/web:ro
      - /srv/secrets/christmas-games:/srv/secrets/christmas-games:ro
      - ${DATA_DIR:-/srv/runtime/christmas-games/data}:/var/lib/christmas-games:rw
    command: ['node', 'server/main.js']
    networks:
      backend:
        aliases:
          - catalog
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4180/healthz']
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
  backend:
    driver: bridge
