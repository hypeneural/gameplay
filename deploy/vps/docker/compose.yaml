services:
  gateway:
    image: nginx:alpine
    container_name: christmas-games-gateway
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/web:/var/www/html/web:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/public/social:/var/www/html/public/social:ro
      - ${MEDIA_DIR:-/srv/runtime/christmas-games/media}:/srv/christmas-private/derived:ro
    networks:
      - edge
      - internal
    depends_on:
      - catalog
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/healthz']
      interval: 15s
      timeout: 5s
      retries: 3

  catalog:
    image: node:24-alpine
    container_name: christmas-games-catalog
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      CATALOG_RELEASE_STAGE: staging-demo
      CATALOG_PUBLIC_ORIGIN: https://jogos.fotosdenatal.com
      CATALOG_SOCIAL_PREVIEW_FILE: /srv/secrets/christmas-games/social-preview.json
      CATALOG_APPLICATION_SHELL: /var/www/html/web/index.html
      PORT: 4180
      HOST: 0.0.0.0
    volumes:
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/server:/app/server:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/package.json:/app/package.json:ro
      - ${RELEASE_DIR:-/srv/runtime/christmas-games/current}/web:/var/www/html/web:ro
      - /srv/secrets/christmas-games/social-preview.json:/srv/secrets/christmas-games/social-preview.json:ro
      - ${DATA_DIR:-/srv/runtime/christmas-games/data}:/var/lib/christmas-games:rw
    command: ['node', 'server/main.js']
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4180/healthz']
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
  internal:
    internal: true
