server {
    listen 80 default_server;
    server_name _;

    # Malformed capability URLs can miss the strict /s/... route matcher.
    access_log off;
    error_log /dev/stderr crit;

    root /var/www/html/web;

    # Vite content-hashed assets are public application code, never customer media.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # staging-demo uses only synthetic fixture photos copied by Vite from public/.
    location ^~ /fixtures/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Token-free liveness endpoint for Caddy and stackctl.
    location = /healthz {
        access_log off;
        proxy_pass http://catalog:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Session URLs contain capability tokens. Do not emit them into access logs.
    location ~ "^/s/[A-Za-z0-9_-]{16,128}(?:/fotos|/game/[a-z0-9-]{1,64}|/social-preview|/data|/media/[0-9a-f-]+/[a-z0-9_-]+/(?:thumb|card|game))?$" {
        access_log off;
        log_not_found off;
        proxy_pass http://catalog:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Generic social image (X-Accel-Redirect from catalog-server).
    location = /_catalog_social/evydencia-christmas-v1.webp {
        internal;
        alias /var/www/html/public/social/evydencia-christmas-v1.webp;
        default_type image/webp;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Reserved for approved customer social derivatives in future pilot.
    location ~ "^/_customer_social/([A-Za-z0-9_-]{16,128})\.webp$" {
        internal;
        alias /srv/christmas-private/derived/social/$1.webp;
        default_type image/webp;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Reserved for future private derivative media authorization.
    location ^~ /internal-media/ {
        internal;
        alias /srv/christmas-private/derived/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only this studio-owned generic asset is public. Customer social art is internal.
    location = /social/evydencia-christmas-v1.webp {
        alias /var/www/html/public/social/evydencia-christmas-v1.webp;
        default_type image/webp;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public synthetic demo: exact homepage and known demo subroutes only.
    # Do NOT fall back to the SPA for unknown routes or /s/:token failures.
    location = / {
        proxy_pass http://catalog:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /demo { return 302 /; }
    location = /demo/ { return 302 /; }

    location = /demo/fotos {
        proxy_pass http://catalog:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/demo/game/[a-z0-9-]{1,64}$" {
        proxy_pass http://catalog:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Do not accidentally expose the SPA shell at arbitrary paths.
    location / {
        return 404;
    }
}
