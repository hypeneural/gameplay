name: Temporary Publisher Format Evidence
on:
  push:
    branches: [audit/p0-release-ci-and-safe-publisher-20261012]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write tools/deploy/publish-session.mjs tools/deploy/publish-session.test.mjs apps/catalog-server/src/publication/corte2Http.test.ts
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const patch = execFileSync('git', ['diff', '-U2', '--', 'tools/deploy/publish-session.mjs', 'tools/deploy/publish-session.test.mjs', 'apps/catalog-server/src/publication/corte2Http.test.ts']);
          console.log('SAFE_PATCH_BASE64=' + patch.toString('base64'));
          NODE
