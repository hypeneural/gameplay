name: Finalize Node First Gallery Lab

on:
  push:
    branches:
      - docs/antigravity-photo-sessions-integration
    paths:
      - '.github/workflows/gallery-lab-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/antigravity-photo-sessions-integration
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove temporary workflow before repository map
        run: rm .github/workflows/gallery-lab-finalize.yml

      - name: Format and regenerate repository map
        run: |
          pnpm format
          pnpm repo:map

      - name: Smoke canonical Gallery Lab prepare command
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-input" "$RUNNER_TEMP/gallery-storage"
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          const root = process.env.RUNNER_TEMP + '/gallery-input';
          await sharp({ create: { width: 700, height: 500, channels: 3, background: '#103e35' } }).jpeg().toFile(root + '/family-landscape.jpg');
          await sharp({ create: { width: 500, height: 700, channels: 3, background: '#8f1d35' } }).jpeg().toFile(root + '/family-portrait.jpg');
          await sharp({ create: { width: 600, height: 600, channels: 3, background: '#d4b15a' } }).png().toFile(root + '/family-square.png');
          NODE
          pnpm gallery:prepare --source "$RUNNER_TEMP/gallery-input" --storage "$RUNNER_TEMP/gallery-storage" > "$RUNNER_TEMP/gallery-receipt.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const receipt = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/gallery-receipt.json', 'utf8'));
          if (receipt.status !== 'ready' || receipt.ready !== 3 || receipt.failed !== 0) throw new Error('Unexpected Gallery Lab receipt');
          if (!receipt.recipeKey || !receipt.worker?.sharpVersion || !receipt.worker?.libvipsVersion) throw new Error('Missing worker fingerprint');
          const config = JSON.parse(await readFile(receipt.configPath, 'utf8'));
          if (config.version !== 2 || config.photos.length !== 3) throw new Error('Unexpected Gallery Lab config');
          for (const photo of config.photos) {
            if (!/^photo-[a-f0-9]{20}$/.test(photo.id)) throw new Error('Unstable/invalid photo id');
            for (const variant of ['thumb', 'card', 'game']) {
              const metric = photo.variantMetrics?.[variant];
              if (!metric || metric.width <= 0 || metric.height <= 0 || metric.byteLength <= 0) throw new Error('Missing derivative metrics');
            }
          }
          const raw = JSON.stringify(config);
          if (raw.includes('family-landscape') || raw.includes('family-portrait') || raw.includes('family-square')) throw new Error('Source filename leaked into browser config');
          NODE

      - name: Run repository quality gates
        run: pnpm check

      - name: Validate assets and provenance
        shell: bash
        run: |
          for manifest in packages/games/*/assets/manifest.json; do
            game=$(basename "$(dirname "$(dirname "$manifest")")")
            pnpm asset:validate --game "$game"
          done
          pnpm asset:validate --owner christmas-shell

      - name: Production build
        run: pnpm build

      - name: Commit final clean tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
          else
            git commit -m "feat(photo-sessions): finalize node-first gallery lab"
            git push origin HEAD:docs/antigravity-photo-sessions-integration
          fi
