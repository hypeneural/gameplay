name: Temporary Activation Formatter
on:
  push:
    branches: [audit/gameplay-activation-crm-recheck-20261011]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Exact Prettier 3.9.6 sources
        run: |
          pnpm exec prettier --write apps/catalog-server/src/publication/corte2Http.test.ts apps/catalog-server/src/publication/PublicationService.ts apps/catalog-server/src/publication/SessionRepository.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = ["apps/catalog-server/src/publication/corte2Http.test.ts","apps/catalog-server/src/publication/PublicationService.ts","apps/catalog-server/src/publication/SessionRepository.ts"];
          for (const path of paths) console.log('ACTIVATION_FORMAT=' + JSON.stringify({
            path, content: readFileSync(path, 'utf8'),
          }));
          NODE
