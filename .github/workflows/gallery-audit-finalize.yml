name: Finalize Gallery Audit Docs

on:
  push:
    branches:
      - docs/antigravity-photo-sessions-integration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Finalize documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/exec-plans/active/CG-PHOTO-SESSIONS-ANTIGRAVITY-2.19.1.md')
          s = p.read_text()
          needle = '- `docs/integrations/photo-sessions/AUDITORIA_FORENSE_ANTIGRAVITY_MOBILE_2026-10-06.md`;\n'
          add = needle + '- `docs/integrations/photo-sessions/AUDITORIA_GITHUB_GALERIA_NATALINA_MOBILE_2026-10-06.md`;\n'
          if 'AUDITORIA_GITHUB_GALERIA_NATALINA_MOBILE_2026-10-06.md' not in s:
              s = s.replace(needle, add)
          p.write_text(s)
          PY
          pnpm exec prettier --write \
            .agents/skills/christmas-gallery-album/SKILL.md \
            docs/index.md \
            docs/integrations/photo-sessions/AUDITORIA_GITHUB_GALERIA_NATALINA_MOBILE_2026-10-06.md \
            docs/integrations/photo-sessions/GALERIA_NATALINA_MULTI_GALERIAS.md \
            docs/integrations/photo-sessions/README.md \
            docs/exec-plans/active/CG-PHOTO-SESSIONS-ANTIGRAVITY-2.19.1.md
          git rm .github/workflows/gallery-audit-finalize.yml
          pnpm repo:map
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs(gallery): finalize GitHub donor audit guidance'
            git push origin HEAD:docs/antigravity-photo-sessions-integration
          fi
