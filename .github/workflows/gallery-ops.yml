name: Gallery Ops (isolated synthetic frontend)

on:
  push:
    branches:
      - feat/natal26-gallery-ops-dashboard-20261028
    paths:
      - 'apps/gallery-ops/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gallery-ops.yml'
  pull_request:
    paths:
      - 'apps/gallery-ops/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gallery-ops.yml'

permissions:
  contents: read

concurrency:
  group: gallery-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-dashboard:
    name: Typecheck, unit tests and isolated build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @christmas-games/gallery-ops build
      - run: pnpm --filter @christmas-games/gallery-ops test
      - name: Block public release shortcuts
        run: |
          test ! -f apps/gallery-ops/dist/fixtures.json
          ! grep -R -E 'VITE_.*(TOKEN|SECRET|KEY)' apps/gallery-ops/src
