name: Gallery Ops (isolated synthetic frontend)

on:
  push:
    branches:
      - feat/natal26-gallery-ops-dashboard-20261028
    paths:
      - 'apps/gallery-ops/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gallery-ops.yml'
  pull_request:
    paths:
      - 'apps/gallery-ops/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gallery-ops.yml'

permissions:
  contents: read

concurrency:
  group: gallery-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-dashboard:
    name: Typecheck, unit tests and isolated build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Temporary read-only formatting for browser specs
        run: |
          pnpm exec prettier --write apps/gallery-ops/e2e/gallery-ops.spec.ts apps/gallery-ops/playwright.config.ts apps/gallery-ops/README.md .github/workflows/gallery-ops.yml
          node -e "const fs=require('node:fs');for(const path of process.argv.slice(1)){console.log('FORMAT_FILE='+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}))}" apps/gallery-ops/e2e/gallery-ops.spec.ts apps/gallery-ops/playwright.config.ts apps/gallery-ops/README.md .github/workflows/gallery-ops.yml
      - run: pnpm --filter @christmas-games/gallery-ops build
      - run: pnpm --filter @christmas-games/gallery-ops test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config apps/gallery-ops/playwright.config.ts
      - name: Keep synthetic dashboard screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-ops-synthetic-screenshots
          path: test-results/gallery-ops-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Block public release shortcuts
        run: |
          test ! -f apps/gallery-ops/dist/fixtures.json
          ! grep -R -E 'VITE_.*(TOKEN|SECRET|KEY)' apps/gallery-ops/src
