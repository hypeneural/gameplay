name: Finalize Native Like Gallery

on:
  push:
    branches:
      - docs/antigravity-photo-sessions-integration
    paths:
      - '.github/workflows/gallery-native-like-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/antigravity-photo-sessions-integration
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and regenerate repository map
        run: |
          pnpm format
          pnpm repo:map

      - name: Run repository quality gates
        run: pnpm check

      - name: Validate assets and provenance
        shell: bash
        run: |
          for manifest in packages/games/*/assets/manifest.json; do
            game=$(basename "$(dirname "$(dirname "$manifest")")")
            pnpm asset:validate --game "$game"
          done
          pnpm asset:validate --owner christmas-shell

      - name: Production build
        run: pnpm build

      - name: Commit generated maintenance changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/gallery-native-like-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(gallery): finalize native-like mobile album"
          git push origin HEAD:docs/antigravity-photo-sessions-integration
