name: Build VPS Staging Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-staging-artifact
  cancel-in-progress: false

jobs:
  build-staging:
    name: Build guarded staging-demo artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify machine-readable repository state
        run: pnpm agent:doctor

      - name: Validate repository
        run: pnpm check

      - name: Validate Assets & Provenance
        run: pnpm asset:validate:all

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Gallery mobile route
        run: pnpm test:e2e:gallery

      - name: Build staging-demo release
        run: pnpm release:staging

      - name: Verify release inventory and SHA-256
        run: pnpm release:verify

      - name: Smoke compiled staging runtime
        run: pnpm release:smoke-runtime

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: christmas-games-vps-staging-${{ github.sha }}
          path: .release/vps/
          if-no-files-found: error
          retention-days: 7
