name: Build VPS Staging Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-staging-artifact
  cancel-in-progress: false

jobs:
  build-staging:
    name: Build guarded staging-demo artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify machine-readable repository state
        run: pnpm agent:doctor

      - name: Validate repository
        run: pnpm check

      - name: Validate Assets & Provenance
        shell: bash
        run: |
          for manifest in packages/games/*/assets/manifest.json; do
            game=$(basename "$(dirname "$(dirname "$manifest")")")
            pnpm asset:validate --game "$game"
          done
          pnpm asset:validate --owner christmas-shell

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Gallery mobile route
        run: pnpm test:e2e:gallery

      - name: Build staging-demo release
        run: pnpm release:staging

      - name: Verify release inventory and SHA-256
        run: pnpm release:verify

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: christmas-games-vps-staging-${{ github.sha }}
          path: .release/vps/
          if-no-files-found: error
          retention-days: 7
