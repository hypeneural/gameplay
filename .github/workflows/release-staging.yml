name: Build VPS Staging Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-staging-artifact
  cancel-in-progress: false

jobs:
  build-staging:
    name: Build guarded staging-demo artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm check

      - name: Build staging-demo release
        run: pnpm release:staging

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: christmas-games-vps-staging-${{ github.sha }}
          path: .release/vps/
          if-no-files-found: error
          retention-days: 7
