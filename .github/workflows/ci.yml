name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality Gates & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript, Lint, Tests, Architecture, Format and RepoMap
        run: pnpm check

      - name: Validate Assets & Provenance
        shell: bash
        run: |
          for manifest in packages/games/*/assets/manifest.json; do
            game=$(basename "$(dirname "$(dirname "$manifest")")")
            pnpm asset:validate --game "$game"
          done
          pnpm asset:validate --owner christmas-shell

      - name: Check deploy readiness policy
        run: pnpm deploy:readiness

      - name: Production Build (fail-closed customer sessions)
        run: pnpm build
