name: Temporary Social Art Rendering Evidence
on:
  push:
    branches:
      - feat/social-og-whatsapp-demo-hub-20261010
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Render OG and print portable binary receipt
        run: |
          pnpm --filter @christmas-games/media-pipeline exec tsx src/renderPublicSocialArt.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const path='apps/catalog-server/public/social/evydencia-christmas-v2.webp';
          const bytes=readFileSync(path);
          console.log('SOCIAL_WEBP_RECEIPT=' + JSON.stringify({
            path, bytes: bytes.length,
            sha256:createHash('sha256').update(bytes).digest('hex'),
            base64: bytes.toString('base64'),
          }));
          NODE
