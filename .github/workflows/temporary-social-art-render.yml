name: Temporary Social OG Source Formatter
on:
  push:
    branches:
      - feat/social-og-whatsapp-demo-hub-20261010
permissions:
  contents: read
jobs:
  exact-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Prettier output as public-source evidence
        run: |
          pnpm exec prettier --write \
            apps/catalog-server/src/socialPreview.ts \
            apps/catalog-server/src/filePreviewRepository.ts \
            apps/catalog-server/src/filePreviewRepository.test.ts \
            apps/catalog-server/src/CatalogServer.test.ts \
            apps/catalog-server/config/social-preview.example.json \
            tools/deploy/prepare-vps-release.mjs \
            tools/deploy/verify-vps-release.mjs \
            tools/media-pipeline/src/renderPublicSocialArt.ts \
            tools/media-pipeline/src/renderPublicSocialArt.test.ts \
            tools/media-pipeline/package.json \
            docs/ops/WHATSAPP_OG_SOCIAL_COVERS_2026-10-10.md \
            apps/catalog-server/ASSET_PROVENANCE.md
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = ["apps/catalog-server/src/socialPreview.ts","apps/catalog-server/src/filePreviewRepository.ts","apps/catalog-server/src/filePreviewRepository.test.ts","apps/catalog-server/src/CatalogServer.test.ts","apps/catalog-server/config/social-preview.example.json","tools/deploy/prepare-vps-release.mjs","tools/deploy/verify-vps-release.mjs","tools/media-pipeline/src/renderPublicSocialArt.ts","tools/media-pipeline/src/renderPublicSocialArt.test.ts","tools/media-pipeline/package.json","docs/ops/WHATSAPP_OG_SOCIAL_COVERS_2026-10-10.md","apps/catalog-server/ASSET_PROVENANCE.md"];
          for (const path of paths) console.log('OG_FORMATTED_SOURCE=' + JSON.stringify({
            path, content: readFileSync(path, 'utf8'),
          }));
          NODE
