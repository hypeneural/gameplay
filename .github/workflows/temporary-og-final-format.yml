name: Temporary OG Final Formatter
on:
  push:
    branches:
      - feat/social-og-whatsapp-demo-hub-20261010
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Format target files and return evidence
        run: |
          pnpm exec prettier --write \
            apps/catalog-server/src/socialPreview.ts \
            apps/catalog-server/src/CatalogServer.test.ts \
            apps/catalog-server/ASSET_PROVENANCE.md \
            docs/ops/WHATSAPP_OG_SOCIAL_COVERS_2026-10-10.md \
            tools/media-pipeline/src/renderPublicSocialArt.ts \
            tools/media-pipeline/src/renderPublicSocialArt.test.ts \
            tools/deploy/prepare-vps-release.mjs \
            tools/deploy/verify-vps-release.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ["apps/catalog-server/src/socialPreview.ts","apps/catalog-server/src/CatalogServer.test.ts","apps/catalog-server/ASSET_PROVENANCE.md","docs/ops/WHATSAPP_OG_SOCIAL_COVERS_2026-10-10.md","tools/media-pipeline/src/renderPublicSocialArt.ts","tools/media-pipeline/src/renderPublicSocialArt.test.ts","tools/deploy/prepare-vps-release.mjs","tools/deploy/verify-vps-release.mjs"]) {
            console.log('OG_FINAL_FORMAT=' + JSON.stringify({path,content:readFileSync(path,'utf8')}));
          }
          NODE
