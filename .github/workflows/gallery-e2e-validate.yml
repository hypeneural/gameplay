name: Validate Native Like Gallery E2E

on:
  push:
    branches:
      - docs/antigravity-photo-sessions-integration
    paths:
      - '.github/workflows/gallery-e2e-validate.yml'
  workflow_dispatch:

jobs:
  gallery-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/antigravity-photo-sessions-integration

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run gallery E2E matrix
        run: pnpm exec playwright test tests/e2e/session-gallery.spec.ts --workers=1
